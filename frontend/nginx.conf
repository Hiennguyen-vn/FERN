server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the API Gateway, stripping the /api prefix.
    # Browser calls  POST /api/auth/login
    #   → gateway receives POST /auth/login
    location /api/ {
        proxy_pass         http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket upgrade for /ws/* (notification-service via gateway)
    location /ws/ {
        proxy_pass         http://api-gateway:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # SPA fallback — serve index.html for any unmatched path so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }
}
