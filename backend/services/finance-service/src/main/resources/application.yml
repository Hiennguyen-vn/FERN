spring:
  application:
    name: finance-service
  datasource:
    url: ${FERN_FINANCE_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_operational?currentSchema=finance}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  flyway:
    enabled: true
    schemas: finance
    default-schema: finance
    locations: classpath:db/migration/postgresql/operational
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${FERN_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${FERN_FINANCE_CONSUMER_GROUP:finance-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${FERN_FINANCE_KAFKA_AUTO_STARTUP:true}
server:
  port: ${PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

fern:
  security:
    jwt:
      secret: ${FERN_JWT_SECRET:}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  master-datasource:
    url: ${FERN_FINANCE_MASTER_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_master?currentSchema=config}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  projection-datasource:
    url: ${FERN_FINANCE_PROJECTION_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_reporting?currentSchema=finance_projection}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  outbox:
    enabled: ${FERN_OUTBOX_ENABLED:true}
    publish-delay-ms: 5000
  clients:
    hr-base-url: ${FERN_HR_BASE_URL:http://localhost:8089}
    hr:
      connect-timeout-ms: ${FERN_HR_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${FERN_HR_READ_TIMEOUT_MS:10000}
      circuit-breaker:
        failure-rate-threshold: ${FERN_HR_CB_FAILURE_RATE_THRESHOLD:50}
        sliding-window-size: ${FERN_HR_CB_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${FERN_HR_CB_MINIMUM_NUMBER_OF_CALLS:5}
        wait-duration-open-seconds: ${FERN_HR_CB_WAIT_DURATION_OPEN_SECONDS:30}
  id-generator:
    node-id: ${FERN_ID_GENERATOR_NODE_ID:9}
    epoch-millis: ${FERN_ID_GENERATOR_EPOCH_MILLIS:1767225600000}
    max-clock-rollback-millis: ${FERN_ID_GENERATOR_MAX_CLOCK_ROLLBACK_MILLIS:5}
