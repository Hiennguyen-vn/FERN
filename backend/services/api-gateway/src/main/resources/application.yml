spring:
  application:
    name: api-gateway
  datasource:
    url: ${FERN_GATEWAY_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_master?currentSchema=gateway}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  flyway:
    enabled: true
    schemas: gateway
    default-schema: gateway
    locations: classpath:db/migration/postgresql/master
  data:
    redis:
      host: ${FERN_REDIS_HOST:localhost}
      port: ${FERN_REDIS_PORT:6379}
      password: ${FERN_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${FERN_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

fern:
  cors:
    # Comma-separated origin patterns (Spring CorsConfiguration). Default * for local dev.
    allowed-origin-patterns: ${FERN_CORS_ALLOWED_ORIGIN_PATTERNS:*}
    allow-credentials: ${FERN_CORS_ALLOW_CREDENTIALS:true}
  outbox:
    enabled: ${FERN_OUTBOX_ENABLED:true}
    publish-delay-ms: 5000
  security:
    jwt:
      # Required at runtime: FernJwtService fails startup if blank (see platform-security).
      secret: ${FERN_JWT_SECRET:}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  routes:
    iam: ${FERN_IAM_ROUTE_URI:http://localhost:8081}
    org: ${FERN_ORG_ROUTE_URI:http://localhost:8082}
    catalog: ${FERN_CATALOG_ROUTE_URI:http://localhost:8085}
    audit: ${FERN_AUDIT_ROUTE_URI:http://localhost:8084}
    pos: ${FERN_POS_ROUTE_URI:http://localhost:8086}
    inventory: ${FERN_INVENTORY_ROUTE_URI:http://localhost:8087}
    procurement: ${FERN_PROCUREMENT_ROUTE_URI:http://localhost:8088}
    hr: ${FERN_HR_ROUTE_URI:http://localhost:8089}
    report: ${FERN_REPORT_ROUTE_URI:http://localhost:8090}
    finance: ${FERN_FINANCE_ROUTE_URI:http://localhost:8091}
    notification: ${FERN_NOTIFICATION_ROUTE_URI:http://localhost:8092}
