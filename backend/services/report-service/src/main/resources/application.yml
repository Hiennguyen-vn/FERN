spring:
  application:
    name: report-service
  datasource:
    url: ${FERN_REPORT_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_master?currentSchema=report}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  flyway:
    enabled: true
    create-schemas: true
    schemas: raw_events,report
    default-schema: raw_events
    locations: classpath:db/migration/postgresql/master
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${FERN_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    consumer:
      group-id: ${FERN_REPORT_CONSUMER_GROUP:report-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${FERN_REPORT_KAFKA_AUTO_STARTUP:true}
server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

fern:
  security:
    jwt:
      secret: ${FERN_JWT_SECRET:}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  id-generator:
    node-id: ${FERN_ID_GENERATOR_NODE_ID:10}
    epoch-millis: ${FERN_ID_GENERATOR_EPOCH_MILLIS:1767225600000}
    max-clock-rollback-millis: ${FERN_ID_GENERATOR_MAX_CLOCK_ROLLBACK_MILLIS:5}
  report:
    export:
      base-dir: ${FERN_REPORT_EXPORT_BASE_DIR:${java.io.tmpdir}/fern-report-exports}
      preview-row-limit: ${FERN_REPORT_EXPORT_PREVIEW_ROW_LIMIT:50}
      artifact-retention-days: ${FERN_REPORT_EXPORT_RETENTION_DAYS:30}
