spring:
  application:
    name: org-service
  datasource:
    url: ${FERN_ORG_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_master?currentSchema=org}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  flyway:
    enabled: true
    schemas: org
    default-schema: org
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: org
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${FERN_REDIS_HOST:localhost}
      port: ${FERN_REDIS_PORT:6379}
      password: ${FERN_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${FERN_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

fern:
  security:
    jwt:
      secret: ${FERN_JWT_SECRET:}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  outbox:
    enabled: ${FERN_OUTBOX_ENABLED:true}
    publish-delay-ms: 5000
