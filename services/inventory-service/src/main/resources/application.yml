spring:
  application:
    name: inventory-service
  datasource:
    url: ${FERN_INVENTORY_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_operational?currentSchema=inventory}
    username: ${FERN_DB_USERNAME:fern}
    password: ${FERN_DB_PASSWORD:fern}
  flyway:
    enabled: true
    schemas: inventory
    default-schema: inventory
    locations: classpath:db/migration/postgresql/operational
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${FERN_INVENTORY_CONSUMER_GROUP:inventory-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${FERN_INVENTORY_KAFKA_AUTO_STARTUP:true}
server:
  port: ${PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

fern:
  security:
    jwt:
      secret: ${FERN_JWT_SECRET:XV4T89da-00NoHY48hZTYhGdaCNpqooKVy4MDKTRO5v4Im6TwlAITKb6_O4K--Iv}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
