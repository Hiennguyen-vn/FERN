spring:
  application:
    name: finance-service
  datasource:
    url: ${FERN_FINANCE_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_operational?currentSchema=finance}
    username: ${FERN_DB_USERNAME:fern}
    password: ${FERN_DB_PASSWORD:fern}
  flyway:
    enabled: true
    schemas: finance
    default-schema: finance
    locations: classpath:db/migration/postgresql/operational
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${FERN_FINANCE_CONSUMER_GROUP:finance-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${FERN_FINANCE_KAFKA_AUTO_STARTUP:true}
server:
  port: ${PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

fern:
  security:
    jwt:
      secret: ${FERN_JWT_SECRET:XV4T89da-00NoHY48hZTYhGdaCNpqooKVy4MDKTRO5v4Im6TwlAITKb6_O4K--Iv}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  projection-datasource:
    url: ${FERN_FINANCE_PROJECTION_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_master?currentSchema=finance_projection}
    username: ${FERN_DB_USERNAME:fern}
    password: ${FERN_DB_PASSWORD:fern}
  outbox:
    enabled: ${FERN_OUTBOX_ENABLED:true}
    publish-delay-ms: 5000
  clients:
    hr-base-url: ${FERN_HR_BASE_URL:http://localhost:8089}
  id-generator:
    node-id: ${FERN_ID_GENERATOR_NODE_ID:9}
    epoch-millis: ${FERN_ID_GENERATOR_EPOCH_MILLIS:1767225600000}
    max-clock-rollback-millis: ${FERN_ID_GENERATOR_MAX_CLOCK_ROLLBACK_MILLIS:5}
