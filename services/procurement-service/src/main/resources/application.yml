spring:
  application:
    name: procurement-service
  datasource:
    url: ${FERN_PROCUREMENT_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_operational?currentSchema=procurement}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  flyway:
    enabled: true
    schemas: procurement
    default-schema: procurement
    locations: classpath:db/migration/postgresql/operational
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${FERN_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

fern:
  security:
    jwt:
      secret: ${FERN_JWT_SECRET:}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  clients:
    org:
      base-url: ${FERN_ORG_BASE_URL:http://localhost:8082}
      connect-timeout: 2s
      read-timeout: 5s
  outbox:
    enabled: ${FERN_OUTBOX_ENABLED:true}
    publish-delay-ms: 5000
  master-datasource:
    url: ${FERN_PROCUREMENT_MASTER_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_master?currentSchema=procurement_master}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
