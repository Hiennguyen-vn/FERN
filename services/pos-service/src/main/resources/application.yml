spring:
  application:
    name: pos-service
  datasource:
    url: ${FERN_POS_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/fern_operational?currentSchema=pos}
    username: ${FERN_DB_USERNAME:}
    password: ${FERN_DB_PASSWORD:}
  flyway:
    enabled: true
    schemas: pos
    default-schema: pos
    locations: classpath:db/migration/postgresql/operational
  kafka:
    bootstrap-servers: ${FERN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${FERN_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

fern:
  security:
    jwt:
      secret: ${FERN_JWT_SECRET:}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  outbox:
    enabled: ${FERN_OUTBOX_ENABLED:true}
    publish-delay-ms: 5000
    max-attempts: 5
  clients:
    catalog:
      base-url: ${FERN_CATALOG_BASE_URL:http://localhost:8085}
      connect-timeout: 2s
      read-timeout: 5s
      circuit-breaker:
        failure-rate-threshold: 50
        minimum-number-of-calls: 4
        sliding-window-size: 8
        wait-duration-in-open-state: 15s
    inventory:
      base-url: ${FERN_INVENTORY_BASE_URL:http://localhost:8087}
      connect-timeout: 2s
      read-timeout: 5s
      circuit-breaker:
        failure-rate-threshold: 50
        minimum-number-of-calls: 4
        sliding-window-size: 8
        wait-duration-in-open-state: 15s
    org:
      base-url: ${FERN_ORG_BASE_URL:http://localhost:8082}
      connect-timeout: 2s
      read-timeout: 5s
